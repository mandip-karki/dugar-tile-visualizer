<div class="room">
  <div class="room__dims">
    <label>
      Width (m)
      <input type="number" step="0.1" min="1.5" max="12" [(ngModel)]="widthM" (ngModelChange)="generate()" />
    </label>
    <label>
      Depth (m)
      <input type="number" step="0.1" min="1.5" max="12" [(ngModel)]="depthM" (ngModelChange)="generate()" />
    </label>
    <label>
      Wall height (m)
      <input type="number" step="0.1" min="2" max="5" [(ngModel)]="heightM" (ngModelChange)="generate()" />
    </label>
  </div>

  <div class="room__canvas-wrap">
    @if (baseImageUrl) {
      <img [src]="baseImageUrl" alt="Room mockup from your dimensions" />
    }
  </div>

  <app-ai-generate-panel [photo]="photo" [floorTile]="floorTile" [wallTile]="wallTile"></app-ai-generate-panel>

  <p class="room__hint">
    This stylized mockup is built from your dimensions, not a photo — pick a floor and/or wall
    tile from the sidebar, then generate an AI photorealistic version.
  </p>
</div>
