<div class="editor">
  <div class="editor__photo-wrap">
    @if (photo) {
      <img [src]="photo.src" alt="Your room photo" />
    }
  </div>

  <app-ai-generate-panel [photo]="photo" [floorTile]="floorTile" [wallTile]="wallTile"></app-ai-generate-panel>

  @if (!floorTile && !wallTile) {
    <p class="editor__hint">Pick a floor and/or wall tile from the sidebar, then generate an AI preview.</p>
  }
</div>
